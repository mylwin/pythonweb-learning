[project]
name = "python-web"
version = "0.1.0"
description = "PythonWeb学习项目"
readme = "README.md"
authors = [
    { name = "mylwin", email = "2232802210@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "cryptography>=50.0.2",
    "fastapi>=0.143.3",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
python-web = "python_web:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
